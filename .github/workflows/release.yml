name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal path. Without this, the only way to find out whether the packaging and checksum
  # steps still work was to push a tag, which is the moment the answer is most expensive.
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22.13.0'
  PNPM_VERSION: '11.4.0'

jobs:
  release:
    name: package windows + extension
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # These must stay separate steps. On Windows the default shell is pwsh, and a
      # multi-line `run:` block reports only the exit code of its LAST command — so
      # `pnpm test` could fail and the step would still go green as long as
      # `pnpm verify:scaffolding` passed. That is how a release was once packaged from
      # a commit whose tests were failing. Separate steps make each gate able to fail
      # the job, and show which one did.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release hygiene
        run: pnpm verify:scaffolding

      # The one claim no unit test in this repository can make: that a real provider, reached with a
      # real credential, still answers and still streams. Everything the app does with a model is
      # covered by tests that mock HTTP — deliberately, so no gate ever spends somebody's key — which
      # means the day a provider renames a model or starts rejecting a request shape, the first person
      # to find out is a learner. This runs before the ~114 MB installer is built, so that finding
      # happens on the runner instead.
      #
      # It is opt-in **by credential**, not by a flag. A step that fell over on a missing key would
      # fail every release of a repository that has none, and there is more than one way to run this
      # app with no provider at all. So the check is skipped, visibly, when its secrets are absent.
      #
      # Only *which* credentials exist is read below. The values are handed to the two steps that need
      # them and to nothing else: the packaging steps run this repository's own build, and a build is
      # not a thing that should be able to read an API key out of its environment.
      - name: Check which live-model credentials are configured
        id: live
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_COMPATA_API_KEY: ${{ secrets.OPENAI_COMPATA_API_KEY }}
          OPENAI_COMPATA_BASE_URL: ${{ secrets.OPENAI_COMPATA_BASE_URL }}
          OPENAI_COMPATA_MODEL: ${{ secrets.OPENAI_COMPATA_MODEL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deepseek = [bool]($env:DEEPSEEK_API_KEY -and $env:DEEPSEEK_API_KEY.Trim())
          $compatible = [bool](
            $env:OPENAI_COMPATA_API_KEY -and $env:OPENAI_COMPATA_API_KEY.Trim() -and
            $env:OPENAI_COMPATA_BASE_URL -and $env:OPENAI_COMPATA_BASE_URL.Trim() -and
            $env:OPENAI_COMPATA_MODEL -and $env:OPENAI_COMPATA_MODEL.Trim()
          )
          "deepseek=$($deepseek.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "compatible=$($compatible.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Live model check: deepseek=$deepseek compatible=$compatible"
          # A half-configured provider is the failure that looks like a passing release, so it is said
          # out loud rather than left to be inferred from a skipped step.
          $partial = ($env:OPENAI_COMPATA_API_KEY -or $env:OPENAI_COMPATA_BASE_URL -or $env:OPENAI_COMPATA_MODEL) -and -not $compatible
          if ($partial) {
            Write-Host '::warning::The compatible provider is only partly configured. The live check needs all of OPENAI_COMPATA_API_KEY, OPENAI_COMPATA_BASE_URL and OPENAI_COMPATA_MODEL; it was skipped.'
          }

      # `DEEPSEEK_API_KEY` is the name the script reads for itself, one completion and one stream at 64
      # tokens each. `DEEPSEEK_BASE_URL` and `DEEPSEEK_MODEL` can be added to the environment below to
      # point it somewhere else.
      - name: Live model check — DeepSeek
        if: steps.live.outputs.deepseek == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/test-llm-connection.mjs --provider deepseek

      # Any OpenAI-compatible endpoint, which is what the third secret exists for: a second vendor can
      # be exercised without touching the preset the app ships with.
      - name: Live model check — compatible provider
        if: steps.live.outputs.compatible == 'true'
        env:
          OPENAI_COMPATA_API_KEY: ${{ secrets.OPENAI_COMPATA_API_KEY }}
          OPENAI_COMPATA_BASE_URL: ${{ secrets.OPENAI_COMPATA_BASE_URL }}
          OPENAI_COMPATA_MODEL: ${{ secrets.OPENAI_COMPATA_MODEL }}
        run: node scripts/test-llm-connection.mjs --provider compatible

      - name: Package the desktop installer
        run: pnpm --filter @focusloop/desktop run package

      - name: Package the extension
        run: pnpm --filter @focusloop/extension run build:zip

      - name: Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'apps/desktop/release/FocusLoop-Setup.exe',
            'apps/extension/release/focusloop-extension.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish the release
        # Only a tag may create a release. A dispatched rehearsal runs everything above and stops
        # here, because a release cannot be attached to a branch.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            apps/desktop/release/FocusLoop-Setup.exe
            apps/extension/release/focusloop-extension.zip
            SHA256SUMS.txt

      # What a rehearsal produces, so the artefacts and their checksums can be inspected without
      # publishing them anywhere.
      - name: Upload the rehearsed artefacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: focusloop-release
          path: |
            apps/desktop/release/FocusLoop-Setup.exe
            apps/extension/release/focusloop-extension.zip
            SHA256SUMS.txt
          retention-days: 7
